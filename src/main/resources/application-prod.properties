# ===== Production Profile Configuration (Render + Aiven MySQL) =====
# Production secrets and URLs are provided via Render Environment Variables.

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Non-destructive update to preserve Aiven MySQL database & 59 products)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Razorpay Credentials
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# CORS (Vercel Frontend URL)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Upload Directory
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Disable Automatic Demo Data Seeding in Production
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.seed.admin=${SEED_ADMIN:false}
