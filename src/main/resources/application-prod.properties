# ===== Production Profile Configuration (Render + Aiven MySQL) =====
# Production secrets and URLs are provided via Render Environment Variables.

# Database (Supports both SPRING_DATASOURCE_URL and DB_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/defaultdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:avnadmin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Non-destructive update to preserve Aiven MySQL database & 59 products)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret (Supports both APP_JWT_SECRET and JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:SportXSecretKeyForJWTTokenGenerationAndValidation2024SecureRandomBase64Encoded}}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Razorpay Credentials (Has fallback defaults so application does not crash on startup)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TSGosUB78xY1Yu}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:1aqUCzC7q04tJ178M1rQew1r}

# CORS (Vercel Frontend URL with fallback to allowed origin pattern)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# Upload Directory
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Disable Automatic Demo Data Seeding in Production
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.seed.admin=${SEED_ADMIN:false}
