spring.application.name=sportx-backend

# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sportx_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Mysql@2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
sportx.jwt.secret=SportXDevSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm!!
sportx.jwt.expiration-ms=86400000

# CORS
sportx.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# File uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
sportx.upload.dir=uploads

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
