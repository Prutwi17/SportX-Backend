# ===== Application =====
spring.application.name=SportX Backend
server.port=${PORT:8080}

# ===== Active Profile Default =====
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=optional:classpath:application-local.properties

# ===== MySQL Database =====
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/sportx_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Mysql@2003}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== JWT =====
app.jwt.secret=${APP_JWT_SECRET:SportXSecretKeyForJWTTokenGenerationAndValidation2024SecureRandomBase64Encoded}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ===== Razorpay =====
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TSGosUB78xY1Yu}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:1aqUCzC7q04tJ178M1rQew1r}

# ===== File Upload =====
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# ===== Jackson =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ===== CORS =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

# ===== Data Seeding Control =====
app.seed.demo-data=${SEED_DEMO_DATA:true}
app.seed.admin=${SEED_ADMIN:true}